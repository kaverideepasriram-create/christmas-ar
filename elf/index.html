
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet the Christmas Elf</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #064e3b, #0f766e);
      color: white;
      text-align: center;
      padding: 25px;
    }

    h1 {
      font-size: 36px;
      margin-top: 25px;
    }

    p {
      font-size: 17px;
    }

    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 500px;
      margin: 25px auto;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
    }

    button {
      background: #d1fae5;
      color: #064e3b;
      border: none;
      padding: 14px 24px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Meet the Christmas Elf!</h1>
  <p>Discover the magic of Christmas with our little elf.</p>
  <p>Rotate, explore and bring the elf into your world using AR!</p>

  <model-viewer
    src="../elf.glb"
    alt="Christmas Elf 3D model"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    shadow-intensity="1">

    <button slot="ar-button">Meet the Elf in AR</button>
  </model-viewer>

  <p>Explore the elf in 3D, or tap the button to view it in your space.</p>
</body>
</html>
